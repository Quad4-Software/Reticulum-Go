        goarch: mips64
      - goos: darwin
        goarch: mips64le
      - goos: darwin
        goarch: s390x
      - goos: freebsd
        goarch: ppc64le
      - goos: freebsd
        goarch: ppc64
      - goos: freebsd
        goarch: mips
      - goos: freebsd
        goarch: mipsle
