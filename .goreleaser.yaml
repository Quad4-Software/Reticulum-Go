# GoReleaser configuration for reticulum-go.
#
# This mirrors the build flags of scripts/ci/build-named-release-binary.sh
# and .github/workflows/release-assets.yml: CGO disabled, trimmed paths,
# stripped debug info, empty build id, and the two version ldflags.
#
# release-assets.yml remains the publisher for GitHub releases. This config
# is for local snapshot builds, CI validation, and a future goreleaser-based
# release path. The js/wasm target and the win7/winxp legacy builds are not
# covered here; they stay in release-assets.yml.
version: 2

project_name: reticulum-go

env:
  - CGO_ENABLED=0

before:
  hooks: []

builds:
  - id: reticulum-go
    main: ./cmd/reticulum-go
    binary: reticulum-go
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
      - solaris
      - illumos
      - aix
      - android
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
      - riscv64
      - ppc64le
      - ppc64
      - mips
      - mipsle
      - mips64
      - mips64le
      - s390x
    goarm:
      - "6"
    ignore:
      # Only the pairs the release matrix builds are kept.
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: windows
        goarch: ppc64le
      - goos: windows
        goarch: ppc64
      - goos: windows
        goarch: mips
      - goos: windows
        goarch: mipsle
      - goos: windows
        goarch: mips64
      - goos: windows
        goarch: mips64le
      - goos: windows
        goarch: s390x
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: darwin
        goarch: ppc64le
      - goos: darwin
        goarch: ppc64
      - goos: darwin
        goarch: mips
      - goos: darwin
        goarch: mipsle
