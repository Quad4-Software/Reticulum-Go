      - goos: android
        goarch: s390x
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.defaultVersion={{ or .Tag .Version }} -X git.quad4.io/reticulum/Reticulum-Go/pkg/common.implementationVersion={{ or .Tag .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: reticulum-go
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "reticulum-go-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "reticulum-go-checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  extra_files: []
