name: Security Scans

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI_GO_VERSION: "1.26.4"
  CI_GOSEC_VERSION: "v2.24.5"
  CI_GOVULNCHECK_VERSION: "v1.1.4"
  CI_TRIVY_VERSION: "0.69.3"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        run: sh scripts/ci/setup-go.sh "${{ env.CI_GO_VERSION }}"

      - name: Install gosec
        run: sh scripts/ci/setup-gosec.sh "${{ env.CI_GOSEC_VERSION }}"

      - name: Install govulncheck
        run: sh scripts/ci/setup-govulncheck.sh "${{ env.CI_GOVULNCHECK_VERSION }}"

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${{ env.CI_TRIVY_VERSION }}"

      - name: Run gosec and govulncheck (parallel)
        shell: bash
        run: |
          set -eu
          fail=0
          gosec ./pkg/... ./cmd/... ./internal/... ./tests/... &
          w1=$!
          govulncheck ./... &
          w2=$!
          wait $w1 || fail=1
          wait $w2 || fail=1
          exit "$fail"

      - name: Trivy FS scan
        run: trivy fs --exit-code 1 .
