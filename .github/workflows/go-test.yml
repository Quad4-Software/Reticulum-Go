# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/setup-python@v6.2.0        a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/setup-node@v6.1.0          395ad3262231945c25e8478fd5baf05154b1d79f
#   actions/upload-artifact@v5.0.0     330a01c490aca151604b8cf639adc76d48f6c5d4
#   actions/download-artifact@v5.0.0   634f93cb2916e3fdff6788551b99b062d0335ce0
#   actions/cache@v4.2.0               1bd1e32a3bdc45362d1e726936510720a7c30a57
#   actions/attest@v4.1.0              59d89421af93a897026c735860bf21b6eb4f7b26
#
name: Go Test Multi-Platform

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CI_GO_NO_TELEMETRY_VERSION: "1.26.4"
  CI_TASK_VERSION: "3.46.3"
  CI_NODE_MAJOR: "22"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local
jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: ubuntu-latest
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install go-no-telemetry
        uses: ./.github/actions/install-go-no-telemetry
        with:
          version: ${{ env.CI_GO_NO_TELEMETRY_VERSION }}

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh rns

      - name: Generate test vectors
        run: task test-crossref -- generate

      - name: Run tests
        run: task test

  test-destructive:
    name: Extra (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [race, leaks, network, fuzz, wasm]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install go-no-telemetry
        uses: ./.github/actions/install-go-no-telemetry
        with:
          version: ${{ env.CI_GO_NO_TELEMETRY_VERSION }}

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Set up Node.js
        if: matrix.suite == 'wasm'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "${{ env.CI_NODE_MAJOR }}"

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh rns

      - name: Generate test vectors
        run: task test-crossref -- generate

      - name: Run suite
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            race) task test-race ;;
            leaks) task test-leaks ;;
            network) task test-network ;;
            fuzz) task test-fuzz ;;
            wasm)
              chmod +x misc/wasm/go_js_wasm_exec
              task test-wasm
              ;;
            *) echo "unknown suite" >&2; exit 1 ;;
          esac
