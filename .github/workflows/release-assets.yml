# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0            9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/upload-artifact@v7.0.1     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8.0.1   3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#
name: Release assets

on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag and release name
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease (preview)
        required: false
        type: boolean
        default: false
      target_commitish:
        description: Commit SHA or branch for the release tag (preview builds)
        required: false
        type: string
        default: ""
    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: false

# Build jobs stay read-only. The publish job elevates to contents: write.
permissions:
  contents: read

env:
  CI_GO_VERSION: "1.26.6"
  CI_GO_LEGACY_WIN7_VERSION: "1.26.6-1"
  CI_GO_LEGACY_WINXP_VERSION: "1.26.6"
  CI_TASK_VERSION: "3.46.3"
  CI_COSIGN_VERSION: "3.0.5"
  CI_TRIVY_VERSION: "0.69.3"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with scripts/build-release-targets.sh
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: s390x
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: "386"
          - goos: freebsd
            goarch: riscv64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: openbsd
            goarch: arm
          - goos: openbsd
            goarch: "386"
          - goos: openbsd
            goarch: ppc64
          - goos: openbsd
            goarch: riscv64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
          - goos: netbsd
            goarch: arm
          - goos: netbsd
            goarch: "386"
          - goos: dragonfly
            goarch: amd64
          - goos: solaris
            goarch: amd64
          - goos: illumos
            goarch: amd64
          - goos: aix
            goarch: ppc64
          - goos: android
            goarch: arm64
          - goos: js
            goarch: wasm

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.tag_name }}
          DEST_DIR: "."
        run: sh scripts/ci/build-named-release-binary.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reticulum-go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reticulum-go-${{ matrix.goos }}-${{ matrix.goarch }}*

      - name: Upload linux-i686 alias
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reticulum-go-linux-i686
          path: reticulum-go-linux-i686

  build-windows-legacy:
    name: Build (windows, ${{ matrix.goarch }}, win7)
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up go-legacy-win7
        run: sh scripts/ci/setup-go-legacy-win7.sh "${{ env.CI_GO_LEGACY_WIN7_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Build with go-legacy-win7
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          LEGACY_GO=/usr/local/go-legacy-win7/bin/go
          want="go${CI_GO_LEGACY_WIN7_VERSION%-*}"
          got="$("$LEGACY_GO" env GOVERSION)"
          echo "go-legacy: $got (want $want)"
          case "$got" in
            "$want"|"$want "*) ;;
            *)
              echo "go-legacy version mismatch: got '$got' want '$want'" >&2
              exit 1
              ;;
          esac
          output_name="reticulum-go-windows-${{ matrix.goarch }}-win7.exe"
          "$LEGACY_GO" build -ldflags="-s -w -X main.defaultVersion=${VERSION}" -o "${output_name}" ./cmd/reticulum-go
          echo "Built: ${output_name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reticulum-go-windows-${{ matrix.goarch }}-win7
          path: reticulum-go-windows-${{ matrix.goarch }}-win7.exe

  build-windows-xp:
    name: Build (windows, ${{ matrix.goarch }}, winxp)
    strategy:
      fail-fast: false
      matrix:
        goarch: [386, amd64]

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up go-legacy-winxp
        run: sh scripts/ci/setup-go-legacy-winxp.sh "${{ env.CI_GO_LEGACY_WINXP_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Build with go-legacy-winxp
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          LEGACY_GO=/usr/local/go-legacy-winxp/bin/go
          want="go${CI_GO_LEGACY_WINXP_VERSION%-*}"
          got="$("$LEGACY_GO" env GOVERSION)"
          echo "go-legacy-winxp: $got (want $want)"
          case "$got" in
            "$want"|"$want "*) ;;
            *)
              echo "go-legacy-winxp version mismatch: got '$got' want '$want'" >&2
              exit 1
              ;;
          esac
          output_name="reticulum-go-windows-${{ matrix.goarch }}-winxp.exe"
          "$LEGACY_GO" build -ldflags="-s -w -X main.defaultVersion=${VERSION}" -o "${output_name}" ./cmd/reticulum-go
          echo "Built: ${output_name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reticulum-go-windows-${{ matrix.goarch }}-winxp
          path: reticulum-go-windows-${{ matrix.goarch }}-winxp.exe

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${{ env.CI_TRIVY_VERSION }}"

      - name: Generate SBOM
        run: task sbom

      - name: Stage SBOM files for release
        run: |
          set -euo pipefail
          cp sbom/sbom.spdx.json reticulum-go-sbom.spdx.json
          cp sbom/sbom.cyclonedx.json reticulum-go-sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-release
          path: |
            reticulum-go-sbom.spdx.json
            reticulum-go-sbom.cyclonedx.json

  examples:
    name: Examples (pageserver, wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Build pageserver (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../reticulum-go-example-pageserver-linux-amd64 .

      - name: Build pageserver (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../reticulum-go-example-pageserver-linux-arm64 .

      - name: Build pageserver (linux/arm v6)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "6"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../reticulum-go-example-pageserver-linux-arm .

      - name: Build pageserver (linux/386)
        env:
          GOOS: linux
          GOARCH: 386
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../reticulum-go-example-pageserver-linux-386 .

      - name: Build pageserver (linux/riscv64)
        env:
          GOOS: linux
          GOARCH: riscv64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../reticulum-go-example-pageserver-linux-riscv64 .

      - name: Build wasm example
        run: task example:wasm:build

      - name: Stage wasm artifact
        run: cp examples/wasm/public/static/reticulum-go.wasm reticulum-go-example-wasm.wasm

      - name: Upload examples artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reticulum-go-examples
          path: |
            reticulum-go-example-pageserver-linux-amd64
            reticulum-go-example-pageserver-linux-arm64
            reticulum-go-example-pageserver-linux-arm
            reticulum-go-example-pageserver-linux-386
            reticulum-go-example-pageserver-linux-riscv64
            reticulum-go-example-wasm.wasm

  release:
    name: Cosign attest and publish release
    runs-on: ubuntu-latest
    needs: [build, build-windows-legacy, build-windows-xp, sbom, examples]
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: merged
          merge-multiple: true

      - name: Verify required platform assets
        run: sh scripts/ci/verify-release-platform-assets.sh merged

      - name: Install cosign
        run: sh scripts/ci/setup-cosign.sh "${{ env.CI_COSIGN_VERSION }}"

      - name: Write cosign private key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "Missing repository secret COSIGN_PRIVATE_KEY (PEM for cosign key; keep cosign.pub in repo)." >&2
            exit 1
          fi
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "${RUNNER_TEMP}/cosign-release.key"
          chmod 600 "${RUNNER_TEMP}/cosign-release.key"

      - name: Cosign attest release assets
        env:
          COSIGN_KEY_PATH: ${{ runner.temp }}/cosign-release.key
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: sh scripts/ci/attest-release-assets.sh merged

      - name: Create release with assets and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TARGET: ${{ inputs.target_commitish }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          shopt -s nullglob
          mapfile -t assets < <(find merged -type f | LC_ALL=C sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release files under merged/" >&2
            find merged -type f -print >&2 || true
            exit 1
          fi
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" \
            -f target_commitish="${RELEASE_TARGET:-${GITHUB_SHA}}" \
            --jq .body > "${notes}.gen" || true
          {
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              echo "**Preview release**: automated weekly snapshot from \`master\`. Not a stable release; use tagged \`v*\` releases for production."
              echo
              echo "Tag: \`${tag}\`"
              echo "Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
              echo
            fi
            if [ -s "${notes}.gen" ]; then
              cat "${notes}.gen"
            else
              echo "Release ${tag}"
            fi
            echo
            echo "## SHA256 digests (backup only)"
            echo
            echo "Prefer verification with cosign: each release file has a matching \`*.cosign.bundle\` signed for this repo; use \`cosign.pub\` and \`scripts/ci/verify-release-attestation.sh\` (or \`cosign verify-blob-attestation\`)."
            echo
            echo '```'
            find merged -type f ! -name '*.cosign.bundle' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            echo '```'
          } > "$notes"
          rm -f "${notes}.gen"
          args=(
            --repo "${GITHUB_REPOSITORY}"
            --title "${tag}"
            --notes-file "$notes"
          )
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -n "${RELEASE_TARGET}" ]; then
            args+=(--target "${RELEASE_TARGET}")
          elif [ "${RELEASE_PRERELEASE}" != "true" ]; then
            args+=(--verify-tag)
          fi
          gh release create "${tag}" "${args[@]}" "${assets[@]}"
