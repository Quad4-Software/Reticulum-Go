# OpenSSF Scorecard supply-chain posture checks.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # harden-runner egress allowlist (block mode). One union list covers
  # every job in this workflow.
  HR_ENDPOINTS: |
    github.com:443
    api.github.com:443
    codeload.github.com:443
    release-assets.githubusercontent.com:443
    objects.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    *.githubapp.com:443
    prod.app-api.stepsecurity.io:443
    agent.api.stepsecurity.io:443
    api.securityscorecards.dev:443

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # run/job metadata for harden-runner
      id-token: write # publishes results to the scorecard API
      security-events: write # uploads SARIF results to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
