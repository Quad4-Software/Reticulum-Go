# Pinned first-party and CodeQL actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                    3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go@v7.0.0                    b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   github/codeql-action/init@v4.38.0          b96794f015dfd88f77b49b1c93e0fa7110f94c63
#   github/codeql-action/analyze@v4.38.0       b96794f015dfd88f77b49b1c93e0fa7110f94c63
#
name: CodeQL

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "20 16 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # harden-runner egress allowlist (block mode).
  HR_ENDPOINTS: |
    github.com:443
    api.github.com:443
    objects.githubusercontent.com:443
    release-assets.githubusercontent.com:443
    go.dev:443
    dl.google.com:443
    storage.googleapis.com:443
    agent.stepsecurity.io:443

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # uploads SARIF results to code scanning
      packages: read # lets CodeQL resolve package dependencies during analysis
      actions: read # run/job metadata for harden-runner
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    env:
      CI_GO_VERSION: "1.27.1"
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go (main module, vendor)
        if: matrix.language == 'go'
        run: go build -mod=vendor ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
