# Pinned first-party and CodeQL actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1                8e8c483db84b4bee98b60c0593521ed34d9990e8
#   github/codeql-action/init@v4.35.2      95e58e9a2cdfd71adc6e0353d5c52f41a045d225
#   github/codeql-action/analyze@v4.35.2   95e58e9a2cdfd71adc6e0353d5c52f41a045d225
#
name: CodeQL

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "20 16 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    env:
      CI_GO_VERSION: "1.26.5"
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go (main module, vendor)
        if: matrix.language == 'go'
        run: go build -mod=vendor ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
