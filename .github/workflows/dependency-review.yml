# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                     3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/dependency-review-action@v5.0.0     a1d282b36b6f3519aa1f3fc636f609c47dddb294
#
name: Dependency Review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # reads the PR diff for dependency changes

env:
  # harden-runner egress allowlist (block mode). One union list covers
  # every job in this workflow.
  HR_ENDPOINTS: >-
    github.com:443
    api.github.com:443
    codeload.github.com:443
    release-assets.githubusercontent.com:443
    objects.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    *.githubapp.com:443
    prod.app-api.stepsecurity.io:443
    agent.api.stepsecurity.io:443

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
