# Host self-check on Android emulator (manual / nightly).
# Does not block PR CI until the job is stable.
name: Self-check Android

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: selfcheck-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # harden-runner egress allowlist (block mode). One union list covers
  # every job in this workflow.
  HR_ENDPOINTS: >-
    github.com:443
    api.github.com:443
    codeload.github.com:443
    release-assets.githubusercontent.com:443
    objects.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    *.githubapp.com:443
    prod.app-api.stepsecurity.io:443
    agent.api.stepsecurity.io:443
    dl.google.com:443
    repo1.maven.org:443
    api.adoptium.net:443
  CI_GO_VERSION: "1.27.1"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local

jobs:
  selfcheck-android:
    name: Android emulator self-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          check-latest: false
          cache: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build android amd64 self-check binary
        env:
          GOOS: android
          GOARCH: amd64
        # android/amd64 requires external linking, so link with the NDK
        # clang preinstalled on the runner image.
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"
          mkdir -p bin/android/amd64
          CGO_ENABLED=1 CC="$CC" go build -ldflags="-s -w" -o bin/android/amd64/reticulum-go ./cmd/reticulum-go

      - name: Run emulator and self-check
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/ci/run-android-self-check.sh
