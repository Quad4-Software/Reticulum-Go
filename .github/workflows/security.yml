# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1            3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact@v7.0.1     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#
name: Security

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # run/job metadata for harden-runner

env:
  # harden-runner egress allowlist (block mode). One union list covers
  # every job in this workflow.
  HR_ENDPOINTS: |
    github.com:443
    api.github.com:443
    codeload.github.com:443
    release-assets.githubusercontent.com:443
    objects.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    *.githubapp.com:443
    prod.app-api.stepsecurity.io:443
    agent.api.stepsecurity.io:443
    azure.archive.ubuntu.com:80
    azure.archive.ubuntu.com:443
    archive.ubuntu.com:80
    security.ubuntu.com:80
    motd.ubuntu.com:443
    esm.ubuntu.com:443
    packages.microsoft.com:443
    ppa.launchpadcontent.net:443
    proxy.golang.org:443
    sum.golang.org:443
    vuln.go.dev:443
    ghcr.io:443
    pkg-containers.githubusercontent.com:443
    public.ecr.aws:443
    rekor.sigstore.dev:443
    go.dev:443
    dl.google.com:443
    storage.googleapis.com:443
  CI_GO_VERSION: "1.27.1"
  CI_TASK_VERSION: "3.46.3"
  CI_TRIVY_VERSION: "0.69.3"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local
  RNS_REQUIRED_SIGNER: e318cbc04468bd574db2b4523dddd710

jobs:
  static-scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: gosec
            setup: setup-gosec.sh
            version: v2.29.0
            task: scan
          - scanner: govulncheck
            setup: setup-govulncheck.sh
            version: v1.7.0
            task: vulncheck

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Install ${{ matrix.scanner }}
        env:
          SETUP_SCRIPT: ${{ matrix.setup }}
          SCANNER_VERSION: ${{ matrix.version }}
        run: sh "scripts/ci/${SETUP_SCRIPT}" "${SCANNER_VERSION}"

      - name: Run ${{ matrix.scanner }}
        env:
          SCANNER_TASK: ${{ matrix.task }}
        run: task "${SCANNER_TASK}"

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${CI_TRIVY_VERSION}"

      - name: Filesystem scan
        run: task trivy:ci

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  sbom:
    name: SBOM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${CI_TRIVY_VERSION}"

      - name: Generate SBOM
        run: task sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/
          if-no-files-found: error
