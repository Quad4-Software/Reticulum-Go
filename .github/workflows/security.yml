# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0            9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/upload-artifact@v7.0.1     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#
name: Security

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CI_GO_VERSION: "1.27.1"
  CI_TASK_VERSION: "3.46.3"
  CI_TRIVY_VERSION: "0.69.3"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local
  RNS_REQUIRED_SIGNER: e46112d44649266d71fe2193e00a4710

jobs:
  static-scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scanner: gosec
            setup: setup-gosec.sh
            version: v2.29.0
            task: scan
          - scanner: govulncheck
            setup: setup-govulncheck.sh
            version: v1.7.0
            task: vulncheck

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Install ${{ matrix.scanner }}
        run: sh scripts/ci/${{ matrix.setup }} "${{ matrix.version }}"

      - name: Run ${{ matrix.scanner }}
        run: task ${{ matrix.task }}

      - name: Verify workspace clean
        uses: ./.github/actions/verify-workspace-clean

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${{ env.CI_TRIVY_VERSION }}"

      - name: Filesystem scan
        run: task trivy:ci

      - name: Verify workspace clean
        uses: ./.github/actions/verify-workspace-clean

  sbom:
    name: SBOM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Apt update (for Trivy .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install Trivy
        run: sh scripts/ci/setup-trivy.sh "${{ env.CI_TRIVY_VERSION }}"

      - name: Generate SBOM
        run: task sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/
          if-no-files-found: error
