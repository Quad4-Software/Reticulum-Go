# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1            3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter@v3.0.2          de90cc6fb38fc0963ad72b210f1f284cd68cea36
#   actions/setup-node@v7.0.0          820762786026740c76f36085b0efc47a31fe5020
#   actions/setup-java@v6.0.0          dd06d9cba3e5552c54d9f8ea23572deb30010f7c
#   vmactions/freebsd-vm@v1.5.5        f0552d3b69211736abd97f02ff3d4674c56b73b1
#   vmactions/openbsd-vm@v1.4.7        86cdc08415d9d0865267e686561e276c52d62530
#   vmactions/haiku-vm@v1.1.5          6a07e023ed05895c09aa73843b58cfa671f34594
#
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CI_GO_VERSION: "1.27.1"
  CI_GO_LEGACY_WIN7_VERSION: "1.27.1-1"
  CI_GO_LEGACY_WINXP_VERSION: "1.26.6"
  CI_TASK_VERSION: "3.46.3"
  CI_REVIVE_VERSION: "v1.15.0"
  CI_STATICCHECK_VERSION: "2026.2.1"
  CI_NODE_MAJOR: "22"
  CI_ODIN_VERSION: "dev-2026-06"
  CI_ZIG_VERSION: "0.16.0"
  CI_DART_VERSION: "3.11.4"
  CI_SWIFT_VERSION: "6.0.3"
  CI_KOTLIN_VERSION: "2.1.10"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local
  TESTSUMMARY_QUIET: "1"
  TESTSUMMARY_RERUN_FAILS: "2"
  RNS_REQUIRED_SIGNER: e318cbc04468bd574db2b4523dddd710

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      core: ${{ steps.filter.outputs.core }}
      bindings: ${{ steps.filter.outputs.bindings }}
      ci: ${{ steps.filter.outputs.ci }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Commit identity check
        run: |
          # Refuse placeholder identities. A repo-local git config once set
          # user.email to the literal string "user.name", poisoning 42 pushed
          # commits; this gate makes sure that cannot merge again.
          if git log --format='%ae%n%ce' | grep -qE '^(user\.name|user\.email|<.*>)$'; then
            echo "placeholder commit identity found:"
            git log --format='%h %an <%ae>' | grep -E 'user\.name|user\.email' | head -5
            exit 1
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs_only:
              - 'docs/**'
              - '**/*.md'
              - '!CONTRIBUTING.md'
              - '!COMPATIBILITY.md'
              - '!CHANGELOG.md'
            core:
              - 'pkg/**'
              - 'cmd/**'
              - 'internal/**'
              - 'tests/**'
              - 'go.mod'
              - 'go.sum'
              - 'vendor/**'
              - 'include/**'
              - 'scripts/**'
              - 'reticulum-go.rsm'
            bindings:
              - 'bindings/**'
              - 'pkg/librns/**'
              - 'pkg/controlapi/**'
            ci:
              - '.github/**'
              - 'Taskfile.yml'
              - 'taskfiles/**'
              - 'Makefile'
              - 'cliff.toml'
              - 'mise.toml'
            examples:
              - 'examples/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}
          revive_version: ${{ env.CI_REVIVE_VERSION }}

      - name: Format check
        run: task fmt-check

      - name: Vet
        run: task vet

      - name: Revive
        run: task lint

      - name: Staticcheck
        run: |
          sh scripts/ci/setup-staticcheck.sh "${{ env.CI_STATICCHECK_VERSION }}"
          task staticcheck

      - name: Installer script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          sh scripts/ci/test-install.sh

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.goarch }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: ubuntu-24.04-arm
            goarch: arm64

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh 'rns==1.5.4'

      - name: Generate crossref vectors
        run: task test-crossref -- generate

      - name: Run binary smoke test
        run: task test-binary-smoke

      - name: Run self-check
        run: task test-self-check

      - name: Run tests
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            go run ./scripts/ci/testsummary -v -vet=all -coverprofile=coverage.out ./...
          else
            task test
          fi

      - name: Upload coverage profile
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-amd64
          path: coverage.out
          retention-days: 14

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-live-interop:
    name: Live interop (Go/Python RNS)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Python venv, RNS, and pyserial
        run: sh scripts/ci/setup-venv-pip.sh 'rns==1.5.4' 'pyserial'

      - name: Build pageserver example for live tests
        run: |
          cd examples/pageserver
          go build -mod=vendor -o example-pageserver .

      - name: Run live interop suite
        env:
          RUN_LIVE_INTEROP: "1"
          PYTHON_INTEROP: ${{ github.workspace }}/.venv/bin/python
        run: go run ./scripts/ci/testsummary -count=1 -timeout 30m ./tests/interop/

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-os-matrix:
    name: OS runtime (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.bindings == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh 'rns==1.5.4'

      - name: Generate crossref vectors
        run: task test-crossref -- generate

      - name: Run OS matrix tests
        run: task test-os-matrix

      - name: Run binary smoke test
        run: task test-binary-smoke

      - name: Run self-check
        run: task test-self-check

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-freebsd:
    name: FreeBSD self-check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run FreeBSD VM tests
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "14.3"
          usesh: true
          prepare: |
            set -eu
            pkg install -y curl git
            curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go${{ env.CI_GO_VERSION }}.freebsd-amd64.tar.gz
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
          run: |
            set -eu
            export PATH=/usr/local/go/bin:$PATH
            export GOFLAGS=-mod=vendor
            export GOPROXY=off
            export GOTOOLCHAIN=local
            go version
            go test -buildvcs=false -short -count=1 -timeout 10m ./pkg/selfcheck/ ./pkg/sandbox/ ./pkg/protect/
            go test -buildvcs=false -short -count=1 -timeout 10m ./pkg/transport/ -run 'Protect|HandlePacket'
            mkdir -p bin
            go build -buildvcs=false -ldflags="-s -w" -o bin/reticulum-go ./cmd/reticulum-go
            ./bin/reticulum-go self-check --binary "$(pwd)/bin/reticulum-go" --json --full

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-openbsd:
    name: OpenBSD self-check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenBSD VM tests
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.7"
          usesh: true
          prepare: |
            set -eu
            pkg_add -I curl
            curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go${{ env.CI_GO_VERSION }}.openbsd-amd64.tar.gz
            rm -rf /usr/local/go
            tar -C /usr/local -xzf /tmp/go.tgz
          run: |
            set -eu
            export PATH=/usr/local/go/bin:$PATH
            export GOFLAGS=-mod=vendor
            export GOPROXY=off
            export GOTOOLCHAIN=local
            go version
            go test -buildvcs=false -short -count=1 -timeout 10m ./pkg/selfcheck/ ./pkg/sandbox/ ./pkg/protect/
            go test -buildvcs=false -short -count=1 -timeout 10m ./pkg/transport/ -run 'Protect|HandlePacket'
            mkdir -p bin
            go build -buildvcs=false -ldflags="-s -w" -o bin/reticulum-go ./cmd/reticulum-go
            ./bin/reticulum-go self-check --binary "$(pwd)/bin/reticulum-go" --json --full

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-haiku:
    name: Haiku self-check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Haiku VM tests
        uses: vmactions/haiku-vm@6a07e023ed05895c09aa73843b58cfa671f34594 # v1.1.5
        with:
          release: "r1beta5"
          usesh: true
          copyback: false
          prepare: |
            set -eu
            pkgman install -y curl
            curl -fsSL -o /tmp/go-bootstrap.tbz https://github.com/korli/go/releases/download/go1.26.1-haiku1/go-1.26.1-haiku-amd64-bootstrap.tbz
            rm -rf /boot/home/user/go
            mkdir -p /boot/home/user/go
            tar -xjf /tmp/go-bootstrap.tbz -C /boot/home/user/go --strip-components=1
          run: |
            set -eu
            export GOROOT=/boot/home/user/go
            export PATH="$GOROOT/bin:$PATH"
            export GOFLAGS=-mod=vendor
            export GOPROXY=off
            export GOTOOLCHAIN=local
            export GOCACHE=/boot/home/user/.cache/go-build
            mkdir -p "$GOCACHE"
            go version
            # Official go.mod targets a newer patch than korli Haiku Go 1.26.1.
            sed -i 's/^go 1\.2[67]\.[0-9][0-9]*$/go 1.26.1/' go.mod
            sed -i 's/go 1\.2[67]\.[0-9][0-9]*/go 1.26.1/g' vendor/modules.txt
            # korli Haiku Go 1.26.1 vet crashes on some deps (lxstamper exit 255).
            go test -buildvcs=false -vet=off -short -count=1 -timeout 15m ./pkg/selfcheck/ ./pkg/sandbox/ ./pkg/protect/
            go test -buildvcs=false -vet=off -short -count=1 -timeout 10m ./pkg/transport/ -run 'Protect|HandlePacket'
            mkdir -p bin
            go build -buildvcs=false -ldflags="-s -w" -o bin/reticulum-go ./cmd/reticulum-go
            ./bin/reticulum-go self-check --binary "$(pwd)/bin/reticulum-go" --json --full

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-qemu-arch:
    name: Linux ${{ matrix.goarch }} self-check (qemu-user)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: "386"
            qemu: qemu-i386-static
          - goarch: arm
            qemu: qemu-arm-static
            goarm: "6"
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: ppc64
            qemu: qemu-ppc64-static
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Install qemu-user-static
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static
          command -v "${QEMU_BIN}"
          "${QEMU_BIN}" --version | head -1
        env:
          QEMU_BIN: ${{ matrix.qemu }}

      - name: Run ${{ matrix.goarch }} self-check
        env:
          GOARM: ${{ matrix.goarm || '' }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: sh scripts/ci/run-qemu-arch-self-check.sh "${GOARCH_TARGET}"

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-odin:
    name: Odin bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Setup Odin
        run: sh scripts/ci/setup-odin.sh "${{ env.CI_ODIN_VERSION }}"

      - name: Run Odin bindings tests
        run: task test-odin

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-zig:
    name: Zig bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Setup Zig
        run: sh scripts/ci/setup-zig.sh "${{ env.CI_ZIG_VERSION }}"

      - name: Run Zig bindings tests
        run: task test-zig

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-cpp:
    name: C++ bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Run C++ bindings tests
        run: task test-cpp

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-c:
    name: C librns examples
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Build C ABI examples
        run: task test-c

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-rust:
    name: Rust bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Run Rust bindings tests and examples
        run: task test-rust

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-swift:
    name: Swift bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Setup Swift
