    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with scripts/build-release-targets.sh
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: s390x
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: "386"
          - goos: freebsd
            goarch: riscv64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: openbsd
            goarch: arm
          - goos: openbsd
            goarch: "386"
          - goos: openbsd
            goarch: ppc64
          - goos: openbsd
            goarch: riscv64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
          - goos: netbsd
            goarch: arm
          - goos: netbsd
            goarch: "386"
          - goos: dragonfly
            goarch: amd64
          - goos: solaris
            goarch: amd64
          - goos: illumos
            goarch: amd64
          - goos: aix
            goarch: ppc64
          - goos: android
            goarch: arm64
          - goos: js
            goarch: wasm

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: "0"
          DEST_DIR: bin
        run: sh scripts/ci/build-named-release-binary.sh

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  build-windows-legacy:
    name: Build (windows, ${{ matrix.goarch }}, win7)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up go-legacy-win7
        run: sh scripts/ci/setup-go-legacy-win7.sh "${{ env.CI_GO_LEGACY_WIN7_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Build with go-legacy-win7
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          LEGACY_GO=/usr/local/go-legacy-win7/bin/go
          want="go${CI_GO_LEGACY_WIN7_VERSION%-*}"
          got="$("$LEGACY_GO" env GOVERSION)"
          echo "go-legacy: $got (want $want)"
          case "$got" in
            "$want"|"$want "*) ;;
            *)
              echo "go-legacy version mismatch: got '$got' want '$want'" >&2
              exit 1
              ;;
          esac
          mkdir -p bin
          "$LEGACY_GO" build -ldflags="-s -w" \
            -o "bin/reticulum-go-windows-${{ matrix.goarch }}-win7.exe" \
            ./cmd/reticulum-go

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  build-windows-xp:
    name: Build (windows, ${{ matrix.goarch }}, winxp)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [386, amd64]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up go-legacy-winxp
        run: sh scripts/ci/setup-go-legacy-winxp.sh "${{ env.CI_GO_LEGACY_WINXP_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Build with go-legacy-winxp
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          LEGACY_GO=/usr/local/go-legacy-winxp/bin/go
          want="go${CI_GO_LEGACY_WINXP_VERSION%-*}"
          got="$("$LEGACY_GO" env GOVERSION)"
          echo "go-legacy-winxp: $got (want $want)"
          case "$got" in
            "$want"|"$want "*) ;;
            *)
              echo "go-legacy-winxp version mismatch: got '$got' want '$want'" >&2
              exit 1
              ;;
          esac
          # Official go.mod targets Go 1.27.x; rewrite down to go-legacy-winxp.
          sed -i 's/^go 1\.2[67]\.[0-9][0-9]*$/go 1.26.6/' go.mod
          sed -i 's/go 1\.2[67]\.[0-9][0-9]*/go 1.26.6/g' vendor/modules.txt
          mkdir -p bin
          "$LEGACY_GO" build -ldflags="-s -w" \
            -o "bin/reticulum-go-windows-${{ matrix.goarch }}-winxp.exe" \
            ./cmd/reticulum-go

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  examples:
    name: Examples (pageserver, wasm)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Build pageserver (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bin
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../bin/reticulum-go-example-pageserver-linux-amd64 .

      - name: Build pageserver (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../bin/reticulum-go-example-pageserver-linux-arm64 .

      - name: Build pageserver (linux/arm v6)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "6"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          cd examples/pageserver
          go build -ldflags="-s -w" -o ../../bin/reticulum-go-example-pageserver-linux-arm .

      - name: Build wasm example (vendor)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bin
          cd examples/wasm
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o ../../bin/reticulum-go-example-wasm.wasm .

      - name: Build daemon wasm
        run: task build-wasm

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  reproducibility:
    name: Reproducible build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Verify byte-identical release builds
        run: task reproducibility

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  benchmark:
    name: Benchmark gate
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Run benchmark thresholds
        run: task test-bench-gate

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean
