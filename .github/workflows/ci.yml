      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run Lua bindings tests and examples
        run: task test-lua

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-java:
    name: Java bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Java bindings tests and examples
        run: task test-java

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-kotlin:
    name: Kotlin bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Kotlin
        run: sh scripts/ci/setup-kotlin.sh "${{ env.CI_KOTLIN_VERSION }}"

      - name: Run Kotlin bindings tests and examples
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          task test-kotlin

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-python:
    name: Python bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Run Python bindings tests and examples
        run: task test-python

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-dart:
    name: Dart bindings
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.CI_DART_VERSION }}

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Run Dart bindings tests
        run: task test-dart

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-mutation:
    name: Mutation testing (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cryptography, pkg: ./pkg/cryptography, threshold: 55 }
          - { name: packet, pkg: ./pkg/packet, threshold: 50 }
          - { name: announce, pkg: ./pkg/announce, threshold: 40 }
          - { name: destination, pkg: ./pkg/destination, threshold: 45 }
          - { name: identity, pkg: ./pkg/identity, threshold: 50 }
          - { name: ifac, pkg: ./pkg/ifac, threshold: 45 }
          - { name: backbone, pkg: ./pkg/backbone, threshold: 40 }
          - { name: interfaces, pkg: ./pkg/interfaces, threshold: 40 }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Run mutation tests
        env:
          MUTATION_PACKAGES: ${{ matrix.pkg }}
          MUTATION_THRESHOLD: ${{ matrix.threshold }}
        run: task test-mutation

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  test-extra:
    name: Extra (${{ matrix.suite }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [race, leaks, sim, fuzz-guided, chaos, soak, bench-gate, wasm]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI
        uses: $/.github/actions/setup-ci
        with:
          go_version: ${{ env.CI_GO_VERSION }}
          task_version: ${{ env.CI_TASK_VERSION }}

      - name: Set up Node.js
        if: matrix.suite == 'wasm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ env.CI_NODE_MAJOR }}"

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh 'rns==1.5.4'

      - name: Generate crossref vectors
        run: task test-crossref -- generate

      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "${SUITE}" in
            race) task test-race ;;
            leaks) task test-leaks ;;
            sim) task test-sim ;;
            network) task test-sim ;;
            fuzz) task test-fuzz-guided ;;
            fuzz-guided) task test-fuzz-guided ;;
            chaos) task test-chaos ;;
            soak) task test-soak && task test-soak-protect ;;
            bench-gate) task test-bench-gate ;;
            wasm) task test-wasm ;;
            *) echo "unknown suite: ${SUITE}" >&2; exit 1 ;;
          esac

      - name: Verify workspace clean
        uses: $/.github/actions/verify-workspace-clean

  build:
    name: Build (${{ matrix.goos }}, ${{ matrix.goarch }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.core == 'true' || needs.changes.outputs.bindings == 'true' || needs.changes.outputs.ci == 'true'
