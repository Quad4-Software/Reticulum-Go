# Build and deploy documentation to GitHub Pages via mike.
# Secure-use: minimal permissions, SHA-pinned actions, gh-pages writes only
# from master pushes, releases, or manual dispatch.
#
# Deployment model: mike builds the site and pushes versioned directories
# to the gh-pages branch. Master deploys as "dev". Releases deploy their
# tag version and update the "latest" alias, which is the default version.

name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "scripts/docs.sh"
      - "scripts/docs-bundle.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "scripts/docs.sh"
      - "scripts/docs-bundle.py"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version identifier to deploy (default: dev)"
        required: false
        default: dev
      set_latest:
        description: Also update the latest alias and default version
        type: boolean
        required: false
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  HR_ENDPOINTS: >-
    github.com:443
    api.github.com:443
    codeload.github.com:443
    objects.githubusercontent.com:443
    release-assets.githubusercontent.com:443
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    prod.app-api.stepsecurity.io:443
    agent.api.stepsecurity.io:443
    pypi.org:443
    files.pythonhosted.org:443

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: pip install --require-hashes -r docs/requirements-docs.txt

      - name: Build download bundles
        run: python3 scripts/docs-bundle.py --require-pdf

      - name: Build site
        run: zensical build --strict

  deploy:
    name: Deploy versioned docs
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes the gh-pages branch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout
        # zizmor: ignore[artipacked] mike needs the token to push gh-pages; no artifacts uploaded
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true  # mike needs the token to push gh-pages

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: pip install --require-hashes -r docs/requirements-docs.txt

      - name: Build download bundles
        run: python3 scripts/docs-bundle.py --require-pdf

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev version
        if: github.event_name == 'push'
        run: mike deploy --push dev

      - name: Hoist root files
        if: github.event_name == 'push'
        run: docs/hoist-root-files.sh dev

      - name: Deploy requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          SET_LATEST: ${{ inputs.set_latest }}
        run: |
          if [ "$SET_LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi

      - name: Hoist root files
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: docs/hoist-root-files.sh "$VERSION"

  deploy-release:
    name: Deploy release version
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes the gh-pages branch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HR_ENDPOINTS }}
      - name: Checkout release tag
        # zizmor: ignore[artipacked] mike needs the token to push gh-pages; no artifacts uploaded
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: true  # mike needs the token to push gh-pages

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: pip install --require-hashes -r docs/requirements-docs.txt

      - name: Build download bundles
        run: python3 scripts/docs-bundle.py --require-pdf

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy release version and latest alias
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest

      - name: Hoist root files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: docs/hoist-root-files.sh "${TAG#v}"
