# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/upload-artifact@v5.0.0     330a01c490aca151604b8cf639adc76d48f6c5d4
#   actions/cache@v4.2.0               1bd1e32a3bdc45362d1e726936510720a7c30a57
#
name: Go No Telemetry Toolchain

on:
  push:
    branches:
      - master
      - dev
    paths:
      - .github/workflows/go-no-telemetry-toolchain.yml
      - scripts/ci/setup-go-no-telemetry.sh
      - scripts/ci/package-go-no-telemetry.sh
      - scripts/ci/install-go-no-telemetry.sh
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

concurrency:
  group: go-no-telemetry-toolchain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CI_GO_NO_TELEMETRY_VERSION: "1.26.4"
  CI_GO_BOOTSTRAP_VERSION: "1.24.6"
  CI_GO_NO_TELEMETRY_ROOT: /usr/local/go-no-telemetry

jobs:
  build:
    name: Build go-no-telemetry (${{ env.CI_GO_NO_TELEMETRY_VERSION }}, linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.CI_GO_NO_TELEMETRY_ROOT }}
          key: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64

      - name: Build from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh scripts/ci/setup-go-no-telemetry.sh "${{ env.CI_GO_NO_TELEMETRY_VERSION }}"

      - name: Package toolchain
        run: |
          set -euo pipefail
          mkdir -p dist
          sh scripts/ci/package-go-no-telemetry.sh \
            "${{ env.CI_GO_NO_TELEMETRY_ROOT }}" \
            "dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64.tar.gz"

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64
          path: |
            dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64.tar.gz
            dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.CI_GO_NO_TELEMETRY_ROOT }}
          key: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-linux-amd64
