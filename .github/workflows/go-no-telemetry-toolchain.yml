# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/upload-artifact@v5.0.0     330a01c490aca151604b8cf639adc76d48f6c5d4
#   actions/cache@v4.2.0               1bd1e32a3bdc45362d1e726936510720a7c30a57
#
name: Go No Telemetry Toolchain

on:
  push:
    branches:
      - master
      - dev
    paths:
      - .github/workflows/go-no-telemetry-toolchain.yml
      - scripts/ci/setup-go-no-telemetry.sh
      - scripts/ci/package-go-no-telemetry.sh
      - scripts/ci/install-go-no-telemetry.sh
      - scripts/ci/platform.sh
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

concurrency:
  group: go-no-telemetry-toolchain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CI_GO_NO_TELEMETRY_VERSION: "1.26.4"
  CI_GO_BOOTSTRAP_VERSION: "1.24.6"
  CI_GO_NO_TELEMETRY_ROOT: /usr/local/go-no-telemetry

jobs:
  build:
    name: Build go-no-telemetry (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CI_GO_NO_TELEMETRY_ROOT }}
          key: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}

      - name: Build from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh scripts/ci/setup-go-no-telemetry.sh "${{ env.CI_GO_NO_TELEMETRY_VERSION }}"

      - name: Package toolchain
        run: |
          set -euo pipefail
          mkdir -p dist
          sh scripts/ci/package-go-no-telemetry.sh \
            "${{ env.CI_GO_NO_TELEMETRY_ROOT }}" \
            "dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}.tar.gz"

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}
          path: |
            dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}.tar.gz
            dist/go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CI_GO_NO_TELEMETRY_ROOT }}
          key: go-no-telemetry-${{ env.CI_GO_NO_TELEMETRY_VERSION }}-${{ matrix.platform }}
