name: Setup CI
description: Install pinned Go, Task, and optional CI tools
inputs:
  go_version:
    description: Go toolchain version
    required: true
  task_version:
    description: Task version
    required: false
    default: "3.46.3"
  revive_version:
    description: When set, install revive at this version
    required: false
    default: ""
  skip_tree_verify:
    description: Set to true to skip reticulum-go.rsm verify entirely (CI otherwise runs it as optional warn-only)
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ inputs.go_version }}
        check-latest: false
        cache: true
        cache-dependency-path: go.sum

    - name: Setup Task
      shell: sh
      run: sh scripts/ci/setup-task.sh "${{ inputs.task_version }}"

    - name: Install revive
      if: inputs.revive_version != ''
      shell: sh
      run: sh scripts/ci/setup-revive.sh "${{ inputs.revive_version }}"

    - name: Verify tree RSM
      if: inputs.skip_tree_verify != 'true'
      shell: sh
      env:
        RNS_REQUIRED_SIGNER: e46112d44649266d71fe2193e00a4710
        RNS_INVENTORY_OUT: ${{ runner.temp }}/reticulum-go-tree-inventory.txt
        RNS_TREE_VERIFY_OPTIONAL: "1"
      run: sh scripts/ci/verify-tree-rsm.sh
