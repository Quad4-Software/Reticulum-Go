name: Setup CI
description: Install pinned go-no-telemetry, Task, and optional CI tools
inputs:
  go_version:
    description: Go toolchain version (go-no-telemetry)
    required: true
  task_version:
    description: Task version
    required: false
    default: "3.46.3"
  revive_version:
    description: When set, install revive at this version
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install go-no-telemetry
      uses: ./.github/actions/install-go-no-telemetry
      with:
        version: ${{ inputs.go_version }}

    - name: Setup Task
      shell: sh
      run: sh scripts/ci/setup-task.sh "${{ inputs.task_version }}"

    - name: Install revive
      if: inputs.revive_version != ''
      shell: sh
      run: sh scripts/ci/setup-revive.sh "${{ inputs.revive_version }}"
