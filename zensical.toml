[project]
site_name = "Reticulum-Go"
site_url = "https://reticulum-go.quad4.io"
site_description = "Reticulum network stack in Go"
repo_url = "https://github.com/Quad4-Software/Reticulum-Go"
edit_uri = "edit/master/docs/en/"
docs_dir = "docs/en"
extra_css = [
  "stylesheets/void.css",
]
nav = [
  { "Home" = "index.md" },
  { "Downloads" = "downloads.md" },
  { "Start" = [
    { "Overview" = "overview.md" },
    { "Architecture" = "architecture.md" },
    { "Getting started" = "getting-started.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "Develop" = [
    { "Package map" = "package-map.md" },
    { "API reference" = "api-reference.md" },
  ] },
  { "Internals" = [
    { "Transport" = "transport.md" },
    { "Interfaces" = "interfaces.md" },
    { "Identity and destinations" = "identity-and-destinations.md" },
    { "Links, channels, and resources" = "links-channels-and-resources.md" },
    { "Cryptography" = "cryptography.md" },
  ] },
  { "Reference" = [
    { "Security" = "security.md" },
    { "Compatibility" = "compatibility.md" },
    { "Control API" = "control-api.md" },
    { "librns" = "librns.md" },
    { "CLI utilities" = "utilities.md" },
    { "Embedding and WebAssembly" = "embedding-and-wasm.md" },
    { "Firecracker microvm" = "microvm.md" },
    { "Development and testing" = "development-and-testing.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Appendix" = [
    { "Deviations from Python RNS" = "deviations.md" },
    { "Packet debugging" = "packet-debug.md" },
    { "Interop timeline" = "interop-timeline.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
features = [
  "navigation.sections",
  "navigation.footer",
  "navigation.top",
  "toc.integrate",
  "content.action.edit",
  "search.highlight",
]
font.text = "Space Grotesk"
font.code = "Space Mono"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"

# Dark "void" first so the no-JS default matches quad4.io
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "void"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "paper"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.extra]
generator = false

[project.extra.version]
provider = "mike"
alias = true
