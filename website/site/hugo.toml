baseURL = "/"
title = "Reticulum-Go"
locale = "en"

[module]
  replacements = 'github.com/Quad4-Software/hugo-reticulum -> ../..'
  [[module.imports]]
    path = "github.com/Quad4-Software/hugo-reticulum"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../../docs/en"
    target = "content/docs"

[params]
  repo_url = "https://github.com/Quad4-Software/Reticulum-Go"
  docs_version = "1.6.1"
  description = "A Go implementation of the Reticulum Network Stack, tracking the Python reference implementation."

  [params.reticulum]
    node_name = "reticulum-go-docs"
    bg = "111111"
    fg = "dddddd"
    max_width = 78
    show_nav = true
    nav_menu = "main"
    footer = "Reticulum-Go documentation"
    link_style = "both"
    wrap_text = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Docs"
  url = "/docs/"
  weight = 2

[[menu.main]]
  name = "Getting started"
  url = "/docs/getting-started/"
  weight = 3

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
home = ["HTML", "Micron"]
page = ["HTML", "Micron"]
section = ["HTML", "Micron"]
taxonomy = ["Micron"]
term = ["Micron"]
