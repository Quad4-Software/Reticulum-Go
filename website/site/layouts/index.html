{{ define "main" }}
<article>
  {{ if not (strings.Contains .Content "<h1") }}<h1>{{ site.Title }}</h1>{{ end }}
  {{ .Content }}
  <h2>Documents</h2>
  <ul class="page-list">
  {{ range where site.RegularPages "Section" "docs" }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
  </ul>
</article>
{{ end }}
