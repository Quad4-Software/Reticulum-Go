<div class="codeblock">
  <pre class="chroma"><code class="language-{{ .Type | default "text" }}">{{ transform.Highlight .Inner .Type }}</code></pre>
  <button class="copy-btn" type="button" aria-label="Copy code" title="Copy code">
    <span class="cb-ic cb-copy">{{ partial "icon" (dict "name" "copy" "size" 14) }}</span>
    <span class="cb-ic cb-check">{{ partial "icon" (dict "name" "check" "size" 14) }}</span>
    <span class="visually-hidden cb-status" role="status"></span>
  </button>
</div>
