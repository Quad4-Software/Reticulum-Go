<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");var c=q||localStorage.getItem("rg-docs-theme")||"system";if(q){localStorage.setItem("rg-docs-theme",c)}if(c!=="light"&&c!=="dark"&&c!=="system"){c="system"}var d=c==="system"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):c;var e=document.documentElement;e.dataset.theme=d;e.dataset.themeChoice=c;e.style.colorScheme=d;e.classList.add("js")}catch(x){}})();</script>
