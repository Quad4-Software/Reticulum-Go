baseURL = "https://hugo-reticulum.example/"
title = "Hugo Reticulum Example"
locale = "en"

[module]
  # Local development: point the module path at this repository. The path
  # is relative to themesDir (exampleSite/themes), so ../.. is the repo
  # root. Remove this when installing the module from a registry.
  replacements = 'github.com/Quad4-Software/hugo-reticulum -> ../..'
  [[module.imports]]
    path = "github.com/Quad4-Software/hugo-reticulum"

[params]
  [params.reticulum]
    node_name = "example-node"
    bg = "111111"
    fg = "dddddd"
    max_width = 72
    show_nav = true
    nav_menu = "main"
    footer = "Served with hugo-reticulum"
    link_style = "both"
    wrap_text = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 3

[outputs]
home = ["Micron"]
page = ["Micron"]
section = ["Micron"]
taxonomy = ["Micron"]
term = ["Micron"]

[taxonomies]
  tag = "tags"
