  - dst: /var/lib/reticulum-go
    type: dir
    file_info:
      mode: 0700
  - dst: /var/lib/reticulum-go/logfile
    type: dir
    file_info:
      mode: 0700
  - src: packaging/reticulum-go.config
    dst: /var/lib/reticulum-go/config
    type: config|noreplace
    file_info:
      mode: 0600
  - src: LICENSE
    dst: /usr/share/licenses/reticulum-go/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/scripts/postinstall.sh
overrides:
  deb:
    depends: []
  rpm:
    depends: []
  archlinux:
    depends: []
    packager: Quad4.io <ivan@quad4.io>
    scripts:
      postupgrade: packaging/scripts/postinstall.sh
