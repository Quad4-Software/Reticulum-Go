# nfpm config for reticulum-go packages.
# Build: make package-deb  or  make package-rpm  or  make package-arch
#
# Environment overrides:
#   VERSION  package version (default from make)
#   BINARY   path to built reticulum-go binary (default bin/reticulum-go)
#   ARCH     package architecture (default from make)

name: reticulum-go
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Quad4.io <ivan@quad4.io>
description: |
  Reticulum network stack (Go).
  Single binary with daemon and tools: status, id, probe, path, cp, x, pageserver.
vendor: Quad4.io
homepage: https://github.com/Quad4-Software/Reticulum-Go
license: Apache-2.0
contents:
  - src: ${BINARY}
    dst: /usr/bin/reticulum-go
    expand: true
    file_info:
      mode: 0755
  - src: /usr/bin/reticulum-go
    dst: /usr/bin/rgostatus
    type: symlink
  - src: /usr/bin/reticulum-go
    dst: /usr/bin/rgoid
    type: symlink
  - src: /usr/bin/reticulum-go
    dst: /usr/bin/rgoprobe
    type: symlink
