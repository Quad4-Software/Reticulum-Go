name: Go Test Multi-Platform

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

env:
  CI_GO_VERSION: "1.25.5"
  CI_TASK_VERSION: "3.46.3"
  CI_NODE_MAJOR: "22"
  GOPRIVATE: git.quad4.io
  GONOSUMDB: git.quad4.io

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: ubuntu-latest
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source
        run: |
          set -eu
          SERVER="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          REPO="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          if [ -z "$SERVER" ] || [ -z "$REPO" ]; then
            echo "Checkout: set GITEA_SERVER_URL/GITEA_REPOSITORY or GITHUB_SERVER_URL/GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [ -n "${GITEA_TOKEN:-}" ] || [ -n "${GITHUB_TOKEN:-}" ]; then
            TOKEN="${GITEA_TOKEN:-$GITHUB_TOKEN}"
            git config --global credential.helper "!f() { echo username=x-access-token; echo password=${TOKEN}; }; f"
          fi
          git init -q && git remote add origin "${SERVER}/${REPO}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD

      - name: Set up Go
        run: sh scripts/ci/setup-go.sh "${{ env.CI_GO_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: sh scripts/ci/setup-node.sh "${{ env.CI_NODE_MAJOR }}"

      - name: Python venv and RNS
        run: sh scripts/ci/setup-venv-pip.sh rns

      - name: Generate test vectors
        run: task test-crossref -- generate

      - name: Run tests
        run: task test

      - name: Run tests with race detector (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: task test-race

      - name: Run Resource Leak tests (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: task test-leaks

      - name: Run Network Simulation tests (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: task test-network

      - name: Live Python-Go interop (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: |
          . .venv/bin/activate
          export RUN_LIVE_INTEROP=1
          export PYTHON_INTEROP="$PWD/.venv/bin/python"
          go test -v -timeout 600s ./tests/interop/...

      - name: Run Fuzz tests (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: task test-fuzz

      - name: Run WebAssembly tests (Linux AMD64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'amd64'
        run: |
          chmod +x misc/wasm/go_js_wasm_exec
          task test-wasm
