name: Go Build Test

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

env:
  CI_GO_VERSION: "1.25.5"
  CI_TASK_VERSION: "3.46.3"

jobs:
  build:
    name: Build (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm64, arm]
        include:
          - goos: js
            goarch: wasm
        exclude:
          - goos: darwin
            goarch: arm

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        run: sh scripts/ci/checkout.sh 1

      - name: Set up Go
        run: sh scripts/ci/setup-go.sh "${{ env.CI_GO_VERSION }}"

      - name: Setup Task
        run: sh scripts/ci/setup-task.sh "${{ env.CI_TASK_VERSION }}"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: '0'
        run: |
          if [ "${{ matrix.goos }}" = "js" ] && [ "${{ matrix.goarch }}" = "wasm" ]; then
            task build-wasm
          else
            task build
          fi
