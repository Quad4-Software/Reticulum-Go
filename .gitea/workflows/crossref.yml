name: Cross-Reference Tests (Python)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossref:
    name: Test against Python Reticulum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Reticulum-Go
        uses: https://git.quad4.io/actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: https://git.quad4.io/actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25'

      - name: Install Python dependencies
        run: pip install --quiet pycryptodome

      - name: Run crossref tests
        run: bash tests/crossref/run_crossref.sh
