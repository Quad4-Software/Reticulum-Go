name: TinyGo Build

on:
  push:
    branches: [ "tinygo" ]
  pull_request:
    branches: [ "tinygo" ]

env:
  CI_GO_VERSION: "1.26.6"
  CI_TINYGO_VERSION: "0.41.1"
  TINYGO_DEB_SHA256: "901fbccffc61adb111656d1f907dfc21b6c499ca841b115866a0d6de2d835fbe"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"

jobs:
  tinygo-build:
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - name: tinygo-default
            target: ""
            output: reticulum-go-tinygo
            make_target: tinygo-build
          - name: tinygo-wasm
            target: wasm
            output: reticulum-go.wasm
            make_target: tinygo-wasm

    runs-on: ubuntu-latest

    outputs:
      build_complete: ${{ steps.build_step.outcome == 'success' }}

    steps:
      - name: Checkout code
        run: |
          set -eu
          SERVER="${GITEA_SERVER_URL:-${GITHUB_SERVER_URL:-}}"
          REPO="${GITEA_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
          if [ -z "$SERVER" ] || [ -z "$REPO" ]; then
            echo "Checkout: set GITEA_SERVER_URL/GITEA_REPOSITORY or GITHUB_SERVER_URL/GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [ -n "${GITEA_TOKEN:-}" ] || [ -n "${GITHUB_TOKEN:-}" ]; then
            TOKEN="${GITEA_TOKEN:-$GITHUB_TOKEN}"
            git config --global credential.helper "!f() { echo username=x-access-token; echo password=${TOKEN}; }; f"
          fi
          git init -q && git remote add origin "${SERVER}/${REPO}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD

      - name: Set up Go
        run: sh scripts/ci/setup-go.sh "${{ env.CI_GO_VERSION }}"

      - name: Apt update (for TinyGo .deb)
        run: sh scripts/ci/exec-priv.sh apt-get update -qq

      - name: Install TinyGo
        run: sh scripts/ci/setup-tinygo.sh "${{ env.CI_TINYGO_VERSION }}"

      - name: Build with TinyGo
        id: build_step
        run: |
          make ${{ matrix.make_target }}
          output_name="${{ matrix.output }}"
          if [ -f "bin/${output_name}" ]; then
            sha256sum "bin/${output_name}" | cut -d' ' -f1 > "bin/${output_name}.sha256"
            echo "Built: ${output_name}"
            echo "Generated checksum: bin/${output_name}.sha256"
          else
            echo "Build output not found: bin/${output_name}"
            ls -la bin/
            exit 1
          fi

      - name: Upload Artifact
        uses: https://git.quad4.io/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: ${{ matrix.name }}
          path: bin/${{ matrix.output }}*
