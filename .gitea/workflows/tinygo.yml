name: TinyGo Build

on:
  push:
    branches: [ "tinygo" ]
  pull_request:
    branches: [ "tinygo" ]

env:
  CI_GO_VERSION: "1.25.0"
  CI_TINYGO_VERSION: "0.37.0"
  TINYGO_DEB_SHA256: "8f34a4aac7f1aa2ad51dc0f4eccd40da13b6f52fbac5c13887d57327e5f0a862"

jobs:
  tinygo-build:
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - name: tinygo-default
            target: ""
            output: reticulum-go-tinygo
            make_target: tinygo-build
          - name: tinygo-wasm
            target: wasm
            output: reticulum-go.wasm
            make_target: tinygo-wasm

    runs-on: ubuntu-latest

    outputs:
      build_complete: ${{ steps.build_step.outcome == 'success' }}

    steps:
      - name: Checkout code
        run: sh scripts/ci/checkout.sh 1

      - name: Set up Go
        run: sh scripts/ci/setup-go.sh "${{ env.CI_GO_VERSION }}"

      - name: Install TinyGo
        run: sh scripts/ci/setup-tinygo.sh "${{ env.CI_TINYGO_VERSION }}"

      - name: Build with TinyGo
        id: build_step
        run: |
          make ${{ matrix.make_target }}
          output_name="${{ matrix.output }}"
          if [ -f "bin/${output_name}" ]; then
            sha256sum "bin/${output_name}" | cut -d' ' -f1 > "bin/${output_name}.sha256"
            echo "Built: ${output_name}"
            echo "Generated checksum: bin/${output_name}.sha256"
          else
            echo "Build output not found: bin/${output_name}"
            ls -la bin/
            exit 1
          fi

      - name: Upload Artifact
        uses: https://git.quad4.io/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: ${{ matrix.name }}
          path: bin/${{ matrix.output }}*
