[package]
name = "rns"
version = "1.5.0"
description = "ctypes bindings for the librns C ABI"
requires-python = ">=3.10"
license = "Apache-2.0"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rns*"]
