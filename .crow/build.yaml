# Mirrors .github/workflows/ci.yml jobs "build" (GOOS/GOARCH release binary
# matrix), "build-windows-legacy" and "build-windows-xp", the "examples" job
# and the "reproducibility" job. The non-matrix steps are pinned to the
# linux/amd64 matrix permutation so they run exactly once. Also covers the
# tinygo.yml builds, which are plain container steps.
variables:
  - &golang_image 'docker.io/library/golang:1.27.3-bookworm'
  - base_env: &base_env
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      TESTSUMMARY_QUIET: '1'
      TESTSUMMARY_RERUN_FAILS: '2'

when:
  - event: push
    branch: master
  - event: pull_request
  - event: manual

cache:
  - key: go-{{ arch }}-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-']
    paths:
      - .cache/go-mod
      - .cache/go-build

# Keep in sync with the build matrix in .github/workflows/ci.yml and
# scripts/build-release-targets.sh.
matrix:
  include:
    - { GOOS: linux, GOARCH: amd64 }
    - { GOOS: linux, GOARCH: '386' }
    - { GOOS: linux, GOARCH: arm64 }
    - { GOOS: linux, GOARCH: arm }
    - { GOOS: linux, GOARCH: riscv64 }
    - { GOOS: linux, GOARCH: ppc64le }
    - { GOOS: linux, GOARCH: ppc64 }
    - { GOOS: linux, GOARCH: mips }
    - { GOOS: linux, GOARCH: mipsle }
    - { GOOS: linux, GOARCH: mips64 }
    - { GOOS: linux, GOARCH: mips64le }
    - { GOOS: linux, GOARCH: s390x }
    - { GOOS: windows, GOARCH: amd64 }
    - { GOOS: windows, GOARCH: arm64 }
    - { GOOS: windows, GOARCH: '386' }
    - { GOOS: darwin, GOARCH: amd64 }
    - { GOOS: darwin, GOARCH: arm64 }
    - { GOOS: freebsd, GOARCH: amd64 }
    - { GOOS: freebsd, GOARCH: arm64 }
    - { GOOS: freebsd, GOARCH: arm }
    - { GOOS: freebsd, GOARCH: '386' }
    - { GOOS: freebsd, GOARCH: riscv64 }
    - { GOOS: openbsd, GOARCH: amd64 }
    - { GOOS: openbsd, GOARCH: arm64 }
    - { GOOS: openbsd, GOARCH: arm }
    - { GOOS: openbsd, GOARCH: '386' }
    - { GOOS: openbsd, GOARCH: ppc64 }
    - { GOOS: openbsd, GOARCH: riscv64 }
    - { GOOS: netbsd, GOARCH: amd64 }
    - { GOOS: netbsd, GOARCH: arm64 }
    - { GOOS: netbsd, GOARCH: arm }
    - { GOOS: netbsd, GOARCH: '386' }
    - { GOOS: dragonfly, GOARCH: amd64 }
    - { GOOS: solaris, GOARCH: amd64 }
    - { GOOS: illumos, GOARCH: amd64 }
    - { GOOS: aix, GOARCH: ppc64 }
    - { GOOS: android, GOARCH: arm64 }
    - { GOOS: js, GOARCH: wasm }

steps:
  build:
    depends_on: []
    image: *golang_image
    environment: *base_env
    commands:
      - DEST_DIR=bin sh scripts/ci/build-named-release-binary.sh

  build-windows-win7:
    depends_on: []
    image: *golang_image
    environment: *base_env
    when:
      - matrix:
          GOOS: linux
          GOARCH: amd64
    commands:
      - sh scripts/ci/setup-go-legacy-win7.sh "1.27.2-1"
      - |
        set -eu
        LEGACY_GO=/usr/local/go-legacy-win7/bin/go
        got="$("$LEGACY_GO" env GOVERSION)"
        echo "go-legacy: $got (want go1.27.2)"
        case "$got" in
          go1.27.2|go1.27.2\ *) ;;
          *)
            echo "go-legacy version mismatch: got '$got'" >&2
            exit 1
            ;;
        esac
        # Official go.mod targets Go 1.27.x; rewrite down to go-legacy-win7.
        sed -i 's/^go 1\.2[67]\.[0-9][0-9]*$/go 1.27.2/' go.mod
        sed -i 's/go 1\.2[67]\.[0-9][0-9]*/go 1.27.2/g' vendor/modules.txt
        mkdir -p bin
        for goarch in amd64 arm64; do
          GOOS=windows GOARCH="$goarch" CGO_ENABLED=0 "$LEGACY_GO" build -ldflags="-s -w" \
            -o "bin/reticulum-go-windows-${goarch}-win7.exe" ./cmd/reticulum-go
        done

  build-windows-winxp:
    depends_on: []
    image: *golang_image
    environment: *base_env
    when:
      - matrix:
          GOOS: linux
          GOARCH: amd64
    commands:
      - sh scripts/ci/setup-go-legacy-winxp.sh "1.27.1"
      - |
        set -eu
        LEGACY_GO=/usr/local/go-legacy-winxp/bin/go
        got="$("$LEGACY_GO" env GOVERSION)"
        echo "go-legacy-winxp: $got (want go1.27.1)"
        case "$got" in
          go1.27.1|go1.27.1\ *) ;;
          *)
            echo "go-legacy-winxp version mismatch: got '$got'" >&2
            exit 1
            ;;
        esac
        # Official go.mod targets Go 1.27.x; rewrite down to go-legacy-winxp.
        sed -i 's/^go 1\.2[67]\.[0-9][0-9]*$/go 1.27.1/' go.mod
        sed -i 's/go 1\.2[67]\.[0-9][0-9]*/go 1.27.1/g' vendor/modules.txt
        mkdir -p bin
        for goarch in 386 amd64; do
          GOOS=windows GOARCH="$goarch" CGO_ENABLED=0 "$LEGACY_GO" build -ldflags="-s -w" \
            -o "bin/reticulum-go-windows-${goarch}-winxp.exe" ./cmd/reticulum-go
        done

  examples:
    depends_on: []
    image: *golang_image
    environment: *base_env
    when:
      - matrix:
          GOOS: linux
          GOARCH: amd64
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - |
        set -eu
        mkdir -p bin
        cd examples/pageserver
        for target in "linux amd64" "linux arm64" "linux arm"; do
          set -- $target
          GOOS="$1" GOARCH="$2" GOARM=6 CGO_ENABLED=0 go build -ldflags="-s -w" \
            -o "../../bin/reticulum-go-example-pageserver-$1-$2" .
        done
      - cd "$${CI_WORKSPACE}/examples/wasm" && GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/reticulum-go-example-wasm.wasm .
      - task build-wasm

  tinygo:
    depends_on: []
    image: *golang_image
    environment: *base_env
    when:
      - matrix:
          GOOS: linux
          GOARCH: amd64
    commands:
      - apt-get update -qq
      - sh scripts/ci/setup-task.sh "3.46.3"
      - TINYGO_DEB_SHA256="8f34a4aac7f1aa2ad51dc0f4eccd40da13b6f52fbac5c13887d57327e5f0a862" sh scripts/ci/setup-tinygo.sh "0.37.0"
      - task tinygo-build
      - task tinygo-wasm

  reproducibility:
    depends_on: []
    image: *golang_image
    environment: *base_env
    when:
      - matrix:
          GOOS: linux
          GOARCH: amd64
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - task reproducibility
