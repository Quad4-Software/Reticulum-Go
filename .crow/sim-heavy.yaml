# Mirrors .github/workflows/sim-heavy.yml: the heavy build-tag simulation
# suite plus the loopback link speedtest smoke. Scheduled like the GitHub
# counterpart; runs manually on demand.
variables:
  - &golang_image 'docker.io/library/golang:1.27.4-bookworm'
  - base_env: &base_env
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      TESTSUMMARY_QUIET: '1'
      TESTSUMMARY_RERUN_FAILS: '2'

when:
  - event: manual

cache:
  - key: go-{{ arch }}-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-']
    paths:
      - .cache/go-mod
      - .cache/go-build

steps:
  sim-heavy:
    image: *golang_image
    environment: *base_env
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - task test-sim-heavy
      - task test-link-speed
