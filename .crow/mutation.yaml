# Mirrors .github/workflows/ci.yml job "test-mutation": gomutant runs per
# package with per-package score thresholds.
variables:
  - &golang_image 'docker.io/library/golang:1.27.3-bookworm'
  - base_env: &base_env
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      TESTSUMMARY_QUIET: '1'
      TESTSUMMARY_RERUN_FAILS: '2'

when:
  - event: push
    branch: master
  - event: pull_request
  - event: manual

cache:
  - key: go-{{ arch }}-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-']
    paths:
      - .cache/go-mod
      - .cache/go-build

matrix:
  include:
    - { MUTATION_PACKAGES: './pkg/cryptography', MUTATION_THRESHOLD: '55' }
    - { MUTATION_PACKAGES: './pkg/packet', MUTATION_THRESHOLD: '50' }
    - { MUTATION_PACKAGES: './pkg/announce', MUTATION_THRESHOLD: '40' }
    - { MUTATION_PACKAGES: './pkg/destination', MUTATION_THRESHOLD: '45' }
    - { MUTATION_PACKAGES: './pkg/identity', MUTATION_THRESHOLD: '50' }
    - { MUTATION_PACKAGES: './pkg/ifac', MUTATION_THRESHOLD: '45' }
    - { MUTATION_PACKAGES: './pkg/backbone', MUTATION_THRESHOLD: '40' }
    - { MUTATION_PACKAGES: './pkg/interfaces', MUTATION_THRESHOLD: '40' }

steps:
  mutation:
    image: *golang_image
    environment: *base_env
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - task test-mutation
