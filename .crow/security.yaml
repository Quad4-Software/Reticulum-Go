# Mirrors the container-friendly parts of .github/workflows/security.yml:
# gosec, govulncheck and the Trivy filesystem scan.
variables:
  - &golang_image 'docker.io/library/golang:1.27.3-bookworm'
  - base_env: &base_env
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      TESTSUMMARY_QUIET: '1'
      TESTSUMMARY_RERUN_FAILS: '2'

when:
  - event: push
    branch: master
  - event: pull_request
  - event: manual

cache:
  - key: go-{{ arch }}-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-']
    paths:
      - .cache/go-mod
      - .cache/go-build

steps:
  gosec:
    depends_on: []
    image: *golang_image
    environment: *base_env
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - sh scripts/ci/setup-gosec.sh "v2.29.1-0.20261009120814-7b1b5cebe007"
      - task scan

  govulncheck:
    depends_on: []
    image: *golang_image
    environment: *base_env
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - sh scripts/ci/setup-govulncheck.sh "v1.7.0"
      - task vulncheck

  trivy:
    depends_on: []
    image: *golang_image
    environment: *base_env
    commands:
      - apt-get update -qq
      - sh scripts/ci/setup-task.sh "3.46.3"
      - sh scripts/ci/setup-trivy.sh "0.69.3"
      - task trivy:ci
