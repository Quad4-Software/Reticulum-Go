# Mirrors .github/workflows/ci.yml jobs "test" (linux/amd64 leg) and the
# "test-extra" race suite: Python venv with pinned RNS for crossref vectors,
# binary smoke test, self-check, full test run, plus the race-detector run.
# Each step is a fresh container sharing only the workspace, so every step
# installs what it runs.
variables:
  - &golang_image 'docker.io/library/golang:1.27.4-bookworm'
  - base_env: &base_env
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      TESTSUMMARY_QUIET: '1'
      TESTSUMMARY_RERUN_FAILS: '2'

when:
  - event: push
    branch: master
  - event: pull_request
  - event: manual

cache:
  - key: go-{{ arch }}-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-']
    paths:
      - .cache/go-mod
      - .cache/go-build

steps:
  test:
    depends_on: []
    image: *golang_image
    environment: *base_env
    commands:
      - apt-get update -qq
      - apt-get install -y -qq python3 python3-venv
      - sh scripts/ci/setup-venv-pip.sh 'rns==1.6.0'
      - sh scripts/ci/setup-task.sh "3.46.3"
      - export PATH="$${CI_WORKSPACE}/.venv/bin:$${PATH}"
      - task test-crossref -- generate
      - task test-binary-smoke
      - task test-self-check
      - go run ./scripts/ci/testsummary -v -vet=all -coverprofile=coverage.out ./...

  # test-race sets CGO_ENABLED=1 inline like the taskfile; race builds need
  # gcc, which golang:*-bookworm already ships.
  race:
    depends_on: []
    image: *golang_image
    environment:
      <<: *base_env
      CGO_ENABLED: '1'
    commands:
      - sh scripts/ci/setup-task.sh "3.46.3"
      - task test-race
